[package]
name = "dashboard-mcp"
description = "MCP server (stdio) that lets AI clients read and write dashboard data"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "mcp-server"
path = "src/main.rs"

[dependencies]
dashboard-core.workspace = true
# The official Rust SDK for MCP; only the server side over stdio is compiled in.
rmcp = { version = "3.10", default-features = false, features = ["server", "macros", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
# One thread is enough: the server answers one client over stdin/stdout.
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
