[package]
name = "dashboard"
description = "DataBoard, a personal dashboard: calendar, meeting notes and portfolio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dashboard-core.workspace = true
serde.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

# Google Drive upload: OAuth in the system browser, token in the OS credential store.
base64 = "0.22"
keyring = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "time"] }
uuid = { version = "1", features = ["v4"] }
