[package]
name = "dashboard"
description = "DataBoard, a personal dashboard: calendar, meeting notes and portfolio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dashboard-core.workspace = true
serde.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

# Google Drive upload: OAuth in the system browser, token in the OS credential store.
base64 = "0.22"
keyring = "4"
# native-tls uses the TLS that ships with Windows, so no TLS library or root
# certificates are compiled into the app.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "net", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
